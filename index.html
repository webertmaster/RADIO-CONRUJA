<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conruja Rádio ao Vivo</title>
    <style>
        :root {
            --bg: #f4f6fa;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #8a94a6;
            --border: #e8edf4;
            --accent: #dc2626;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: var(--bg); padding-bottom: 110px; transition: background 0.3s; }

        /* HEADER */
        .header { 
            background: var(--card);
            padding: 15px 25px; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo {
            width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #dc2626, #f59e0b);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            padding: 3px;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; animation: dance 2s infinite; }
        @keyframes dance { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
        .header h1 { font-size: 20px; color: var(--text); font-weight: 800; }
        .header h1 span { color: var(--accent); }

        .header-right { display: flex; align-items: center; gap: 10px; }
        .live-badge {
            background: var(--accent); color: white; padding: 5px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 700; letter-spacing: 1px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .theme-toggle {
            background: var(--bg); border: 1px solid var(--border); width: 38px; height: 38px;
            border-radius: 50%; cursor: pointer; font-size: 16px; transition: all 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.1); }

        .content { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* TOOLBAR */
        .toolbar {
            background: var(--card); padding: 18px; border-radius: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 25px;
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
            border: 1px solid var(--border);
        }
        .toolbar select, .toolbar input {
            padding: 12px 16px; font-size: 15px; border: 1px solid var(--border);
            border-radius: 10px; outline: none; background: var(--bg); color: var(--text);
            transition: all 0.2s;
        }
        .toolbar select { min-width: 240px; cursor: pointer; font-weight: 600; }
        .toolbar input { flex: 1; min-width: 200px; }
        .toolbar select:focus, .toolbar input:focus { border-color: var(--accent); }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
        }
        .section-title { font-size: 20px; color: var(--text); font-weight: 700; }
        .station-count {
            background: var(--card); border: 1px solid var(--border);
            color: var(--muted); padding: 6px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
        }

        /* GRID ESTILO RADIO-AO-VIVO */
        .radio-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 14px; margin-bottom: 40px;
        }
        
        .radio-card { 
            background: var(--card); 
            border-radius: 14px; 
            padding: 14px;
            display: flex; 
            align-items: center; 
            gap: 14px;
            cursor: pointer; 
            transition: all 0.2s;
            border: 1px solid var(--border);
            position: relative;
        }
        .radio-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            border-color: var(--accent);
        }
        .radio-card.playing { 
            border-color: var(--accent); 
            background: linear-gradient(135deg, rgba(220,38,38,0.05), rgba(220,38,38,0.02));
        }
        
        .radio-card-logo {
            width: 54px; height: 54px; border-radius: 12px; 
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; overflow: hidden; flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .radio-card-logo img { width: 100%; height: 100%; object-fit: cover; }
        
        .radio-card-info { flex: 1; min-width: 0; }
        .radio-card-info h3 { 
            font-size: 15px; color: var(--text); font-weight: 700; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 3px;
        }
        .radio-card-info p { 
            font-size: 12px; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .web-badge {
            display: inline-block; background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white; padding: 2px 8px; border-radius: 8px;
            font-size: 9px; font-weight: 700; letter-spacing: 0.5px; margin-left: 6px;
            vertical-align: middle;
        }

        /* Mini equalizador no card quando tocando */
        .card-eq { display: none; gap: 2px; align-items: flex-end; height: 18px; flex-shrink: 0; }
        .radio-card.playing .card-eq { display: flex; }
        .card-eq span { width: 3px; background: var(--accent); border-radius: 2px; animation: eq-bass 0.8s infinite ease-in-out alternate; }
        .card-eq span:nth-child(1) { animation-duration: 0.6s; }
        .card-eq span:nth-child(2) { animation-duration: 0.9s; animation-delay: 0.1s; }
        .card-eq span:nth-child(3) { animation-duration: 0.7s; animation-delay: 0.2s; }

        .play-hint {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--accent); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0; opacity: 0; transition: opacity 0.2s;
        }
        .radio-card:hover .play-hint { opacity: 1; }
        .radio-card.playing .play-hint { opacity: 1; }

        @keyframes eq-bass { 0% { height: 20%; } 100% { height: 100%; } }

        .loading-text { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 15px; grid-column: 1 / -1; }

        /* PLAYER COMPACTO (o que você gostou) */
        .player-bar { 
            position: fixed; bottom: 15px; left: 50%; 
            transform: translateX(-50%) translateY(150%); 
            width: 90%; max-width: 450px; height: 65px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white; padding: 0 20px; border-radius: 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 1000; 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .player-bar.visible { transform: translateX(-50%) translateY(0); }
        .player-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .station-logo-container { 
            width: 45px; height: 45px; border-radius: 12px; background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; overflow: hidden; 
            position: relative; flex-shrink: 0;
        }
        .station-logo { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; border-radius: 12px; }
        .station-logo.hidden { display: none; }
        .player-info { min-width: 0; flex: 1; }
        .player-info h4 { font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
        .player-info span { font-size: 11px; color: #94a3b8; }
        .player-center { display: flex; align-items: center; gap: 12px; }
        .visualizer { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
        .visualizer span { width: 3px; background: linear-gradient(to top, #3b82f6, #8b5cf6, #ec4899); border-radius: 2px; height: 10%; }
        .visualizer.playing span { animation: eq-bass 0.8s infinite ease-in-out alternate; }
        .visualizer span:nth-child(1) { animation-duration: 0.6s; }
        .visualizer span:nth-child(2) { animation-duration: 0.9s; animation-delay: 0.1s; }
        .visualizer span:nth-child(3) { animation-duration: 0.7s; animation-delay: 0.2s; }
        .visualizer span:nth-child(4) { animation-duration: 1.0s; animation-delay: 0.1s; }
        .visualizer span:nth-child(5) { animation-duration: 0.8s; animation-delay: 0.3s; }
        .volume-control { display: flex; align-items: center; gap: 6px; }
        .volume-icon { font-size: 16px; cursor: pointer; }
        .volume-slider { width: 60px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; -webkit-appearance: none; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #3b82f6; border-radius: 50%; cursor: pointer; }
        .btn-play { 
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white; border: none; width: 40px; height: 40px; border-radius: 50%; 
            font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; flex-shrink: 0; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        @media (max-width: 768px) {
            .radio-grid { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar select { min-width: 100%; }
            .visualizer, .volume-slider { display: none; }
            .player-bar { width: calc(100% - 20px); height: 60px; }
            .header h1 { font-size: 17px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <img src="coruja.png.png" alt="Conruja">
            </div>
            <h1>Conruja <span>ao Vivo</span></h1>
        </div>
        <div class="header-right">
            <div class="live-badge">● AO VIVO</div>
            <button class="theme-toggle" id="theme-toggle" title="Alternar tema">🌙</button>
        </div>
    </header>

    <main class="content">
        <div class="toolbar">
            <select id="state-select">
                <option value="">🗺️ Todas as regiões</option>
            </select>
            <input type="text" id="search-input" placeholder="🔍 Buscar rádio por nome...">
        </div>

        <div class="section-header">
            <h2 class="section-title" id="section-title">Estações de rádio</h2>
            <div class="station-count" id="station-count">0 rádios</div>
        </div>
        <div id="radio-list" class="radio-grid">
            <p class="loading-text">📻 Selecione um estado para ver as rádios</p>
        </div>
    </main>

    <footer id="radio-player" class="player-bar">
        <div class="player-left">
            <div class="station-logo-container">
                <span>📻</span>
                <img id="station-logo" src="" alt="Logo" class="station-logo hidden">
            </div>
            <div class="player-info">
                <h4 id="station-name">Nenhuma rádio</h4>
                <span id="station-state">--</span>
            </div>
        </div>
        <div class="player-center">
            <div class="visualizer" id="visualizer">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="volume-control">
                <span class="volume-icon" id="volume-icon">🔊</span>
                <input type="range" id="volume-slider" min="0" max="100" value="80">
            </div>
            <button id="btn-play" class="btn-play">▶</button>
        </div>
        <audio id="audio-element"></audio>
    </footer>

    <script>
        // ============================================
        // MODO ESCURO (igual ao site de referência)
        // ============================================
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        });

        // ============================================
        // DADOS POR ESTADO + palavras-chave ampliadas
        // ============================================
        const dadosEstados = {
            'Acre': { sigla: 'ac', cidades: ['rio branco'], extras: [] },
            'Alagoas': { sigla: 'al', cidades: ['maceió', 'arapiraca'], extras: [] },
            'Amapá': { sigla: 'ap', cidades: ['macapá'], extras: [] },
            'Amazonas': { sigla: 'am', cidades: ['manaus'], extras: [] },
            'Bahia': { sigla: 'ba', cidades: ['salvador', 'feira de santana', 'vitória da conquista', 'ilhéus'], extras: [] },
            'Ceará': { sigla: 'ce', cidades: ['fortaleza', 'juazeiro do norte', 'sobral'], extras: [] },
            'Distrito Federal': { sigla: 'df', cidades: ['brasília'], extras: [] },
            'Espírito Santo': { sigla: 'es', cidades: ['vitória', 'vila velha', 'serra', 'cachoeiro'], extras: [] },
            'Goiás': { sigla: 'go', cidades: ['goiânia', 'anápolis', 'rio verde'], extras: [] },
            'Maranhão': { sigla: 'ma', cidades: ['são luís', 'imperatriz'], extras: [] },
            'Mato Grosso': { sigla: 'mt', cidades: ['cuiabá', 'várzea grande', 'rondonópolis'], extras: [] },
            'Mato Grosso do Sul': { sigla: 'ms', cidades: ['campo grande', 'dourados'], extras: [] },
            'Minas Gerais': { sigla: 'mg', cidades: ['belo horizonte', 'uberlândia', 'juiz de fora', 'montes claros'], extras: [] },
            'Pará': { sigla: 'pa', cidades: ['belém', 'ananindeua', 'santarém'], extras: [] },
            'Paraíba': { sigla: 'pb', cidades: ['joão pessoa', 'campina grande'], extras: [] },
            'Paraná': { sigla: 'pr', cidades: ['curitiba', 'londrina', 'maringá', 'cascavel'], extras: [] },
            'Pernambuco': { sigla: 'pe', cidades: ['recife', 'olinda', 'caruaru', 'petrolina'], extras: [] },
            'Piauí': { sigla: 'pi', cidades: ['teresina', 'parnaíba'], extras: [] },
            'Rio de Janeiro': { sigla: 'rj', cidades: ['rio de janeiro', 'niterói', 'campos', 'petrópolis'], extras: [] },
            'Rio Grande do Norte': { 
                sigla: 'rn', 
                cidades: ['natal', 'mossoró', 'parnamirim', 'caicó', 'assu', 'currais novos', 'pau dos ferros', 'apodi', 'macau', 'macaíba'],
                extras: ['zona norte', 'cabugi', 'seridó', 'serido', 'potengi', 'potiguar', 'tcm', 'vale verde', 'portalegre', 'caraúbas']
            },
            'Rio Grande do Sul': { sigla: 'rs', cidades: ['porto alegre', 'caxias do sul', 'pelotas', 'santa maria'], extras: [] },
            'Rondônia': { sigla: 'ro', cidades: ['porto velho', 'ji-paraná'], extras: [] },
            'Roraima': { sigla: 'rr', cidades: ['boa vista'], extras: [] },
            'Santa Catarina': { sigla: 'sc', cidades: ['florianópolis', 'joinville', 'blumenau', 'chapecó'], extras: [] },
            'São Paulo': { sigla: 'sp', cidades: ['são paulo', 'campinas', 'santos', 'ribeirão preto', 'sorocaba'], extras: [] },
            'Sergipe': { sigla: 'se', cidades: ['aracaju'], extras: [] },
            'Tocantins': { sigla: 'to', cidades: ['palmas', 'araguaína'], extras: [] }
        };

        // Web rádios populares (o TRUQUE do radio-ao-vivo: elas entram em todos os estados)
        const websRadios = ['hunter', 'fictop', 'ding'];

        // ============================================
        // VALIDAÇÃO: a rádio é mesmo do estado?
        // ============================================
        function pertenceAoEstado(station, estado) {
            const info = dadosEstados[estado] || { sigla: '', cidades: [], extras: [] };
            const state = (station.state || '').toLowerCase().trim();
            const estadoLower = estado.toLowerCase();

            if (state) {
                if (state === estadoLower) return true;
                if (info.sigla && state === info.sigla) return true;
                return false;
            }

            const name = (station.name || '').toLowerCase();
            const city = (station.city || '').toLowerCase();
            const tags = (station.tags || '').toLowerCase().split(',').map(t => t.trim());

            const chaves = [...info.cidades, ...info.extras, estadoLower];
            if (info.sigla) chaves.push(info.sigla);

            return chaves.some(ch => {
                if (tags.includes(ch)) return true;
                if (city.includes(ch)) return true;
                if (ch.length >= 4 && name.includes(ch)) return true;
                return false;
            });
        }

        // ============================================
        // ELEMENTOS
        // ============================================
        const audioElement = document.getElementById('audio-element');
        const playerBar = document.getElementById('radio-player');
        const stationNameEl = document.getElementById('station-name');
        const stationStateEl = document.getElementById('station-state');
        const stationLogoEl = document.getElementById('station-logo');
        const btnPlay = document.getElementById('btn-play');
        const visualizer = document.getElementById('visualizer');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeIcon = document.getElementById('volume-icon');
        const stateSelect = document.getElementById('state-select');
        const radioList = document.getElementById('radio-list');
        const searchInput = document.getElementById('search-input');
        const stationCountEl = document.getElementById('station-count');
        const sectionTitle = document.getElementById('section-title');

        let currentStationUuid = null;
        let currentStations = [];

        // VOLUME
        audioElement.volume = 0.8;
        volumeSlider.addEventListener('input', (e) => {
            audioElement.volume = e.target.value / 100;
            updateVolumeIcon(audioElement.volume);
        });
        function updateVolumeIcon(v) {
            volumeIcon.textContent = v === 0 ? '🔇' : (v < 0.5 ? '🔉' : '🔊');
        }
        volumeIcon.addEventListener('click', () => {
            if (audioElement.volume > 0) {
                audioElement.dataset.previousVolume = audioElement.volume;
                audioElement.volume = 0; volumeSlider.value = 0; updateVolumeIcon(0);
            } else {
                const prev = parseFloat(audioElement.dataset.previousVolume) || 0.8;
                audioElement.volume = prev; volumeSlider.value = prev * 100; updateVolumeIcon(prev);
            }
        });

        // PLAY
        function playStation(station) {
            playerBar.classList.add('visible');
            stationNameEl.textContent = station.name;
            stationStateEl.textContent = station.state || 'Web Rádio';
            currentStationUuid = station.stationuuid;
            
            if (station.favicon) {
                stationLogoEl.src = station.favicon;
                stationLogoEl.classList.remove('hidden');
                stationLogoEl.onerror = () => stationLogoEl.classList.add('hidden');
            } else {
                stationLogoEl.classList.add('hidden');
            }

            document.querySelectorAll('.radio-card').forEach(item => {
                item.classList.toggle('playing', item.dataset.uuid === station.stationuuid);
            });

            audioElement.src = station.url_resolved;
            audioElement.play().catch(err => {
                console.warn("Erro:", err);
                btnPlay.textContent = '▶';
                visualizer.classList.remove('playing');
            });
            
            btnPlay.textContent = '⏸';
            visualizer.classList.add('playing');
        }

        btnPlay.addEventListener('click', () => {
            if (audioElement.paused) {
                audioElement.play(); btnPlay.textContent = '⏸'; visualizer.classList.add('playing');
            } else {
                audioElement.pause(); btnPlay.textContent = '▶'; visualizer.classList.remove('playing');
            }
        });

        // SELECT DE ESTADOS
        Object.keys(dadosEstados).forEach(uf => {
            const opt = document.createElement('option');
            opt.value = uf; opt.textContent = uf;
            stateSelect.appendChild(opt);
        });

        // ============================================
        // BUSCA INTELIGENTE + WEB RÁDIOS (truque do site)
        // ============================================
        stateSelect.addEventListener('change', async (e) => {
            const estado = e.target.value;
            if (!estado) {
                radioList.innerHTML = '<p class="loading-text">📻 Selecione um estado para ver as rádios</p>';
                stationCountEl.textContent = '0 rádios';
                sectionTitle.textContent = 'Estações de rádio';
                return;
            }

            sectionTitle.textContent = `Rádios de ${estado}`;
            radioList.innerHTML = '<p class="loading-text">📡 Buscando rádios locais + web rádios...</p>';
            stationCountEl.textContent = 'Buscando...';

            try {
                const info = dadosEstados[estado] || { sigla: '', cidades: [], extras: [] };
                const base = 'https://de1.api.radio-browser.info/json/stations/search?countrycode=BR&limit=300&order=clickcount&reverse=true';
                
                // Buscas locais (validadas pelo estado)
                const urlsLocais = [ `${base}&state=${encodeURIComponent(estado)}` ];
                if (info.sigla) urlsLocais.push(`${base}&state=${encodeURIComponent(info.sigla)}`);
                info.cidades.slice(0, 8).forEach(c => urlsLocais.push(`${base}&name=${encodeURIComponent(c)}`));
                info.extras.slice(0, 6).forEach(c => urlsLocais.push(`${base}&name=${encodeURIComponent(c)}`));
                urlsLocais.push(`${base}&tag=${encodeURIComponent(estado.toLowerCase())}`);

                // Buscas de web rádios (entram em todos os estados, igual ao site de referência)
                const urlsWebs = websRadios.map(w => `${base}&name=${encodeURIComponent(w)}`);

                const [resLocais, resWebs] = await Promise.all([
                    Promise.all(urlsLocais.map(u => fetch(u).then(r => r.json()).catch(() => []))),
                    Promise.all(urlsWebs.map(u => fetch(u).then(r => r.json()).catch(() => [])))
                ]);

                let todas = [];

                // Locais: valida pelo estado
                resLocais.forEach(lista => {
                    if (!Array.isArray(lista)) return;
                    lista.forEach(st => {
                        if (st.url_resolved && pertenceAoEstado(st, estado)) {
                            todas.push({ ...st, isWeb: false });
                        }
                    });
                });

                // Webs: entra sem validação (são nacionais/temáticas)
                resWebs.forEach(lista => {
                    if (!Array.isArray(lista)) return;
                    lista.forEach(st => {
                        if (st.url_resolved) todas.push({ ...st, isWeb: true });
                    });
                });

                // Remove duplicados
                const unicas = [];
                const vistos = new Set();
                todas.forEach(st => {
                    if (vistos.has(st.stationuuid)) return;
                    vistos.add(st.stationuuid);
                    unicas.push(st);
                });

                // Ordena pelas mais populares
                unicas.sort((a, b) => (b.clickcount || 0) - (a.clickcount || 0));

                currentStations = unicas;

                if (unicas.length === 0) {
                    radioList.innerHTML = '<p class="loading-text">😕 Nenhuma rádio encontrada.</p>';
                    stationCountEl.textContent = '0 rádios';
                    return;
                }

                renderStations(unicas);
            } catch (error) {
                radioList.innerHTML = '<p class="loading-text" style="color:red">❌ Erro ao buscar.</p>';
                stationCountEl.textContent = 'Erro';
                console.error(error);
            }
        });

        // BUSCA POR NOME
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (term.length < 2) {
                if (currentStations.length > 0) renderStations(currentStations);
                return;
            }
            renderStations(currentStations.filter(s => s.name.toLowerCase().includes(term)));
        });

        // ============================================
        // RENDERIZAR (layout estilo radio-ao-vivo)
        // ============================================
        function renderStations(stations) {
            radioList.innerHTML = '';
            stationCountEl.textContent = `${stations.length} rádios`;
            
            stations.forEach(station => {
                const div = document.createElement('div');
                div.className = 'radio-card';
                if (station.stationuuid === currentStationUuid) div.classList.add('playing');
                div.dataset.uuid = station.stationuuid;
                
                const city = station.city || (station.isWeb ? 'Web Rádio' : 'Cidade não informada');
                const genre = station.tags ? station.tags.split(',')[0] : 'Geral';
                
                let logoHTML = '';
                if (station.favicon) {
                    logoHTML = `<img src="${station.favicon}" alt="" onerror="this.parentElement.innerHTML='📻'">`;
                }
                
                div.innerHTML = `
                    <div class="radio-card-logo">${logoHTML || '📻'}</div>
                    <div class="radio-card-info">
                        <h3>${station.name}${station.isWeb ? '<span class="web-badge">WEB</span>' : ''}</h3>
                        <p>📍 ${city} • ${genre}</p>
                    </div>
                    <div class="card-eq"><span></span><span></span><span></span></div>
                    <div class="play-hint">▶</div>
                `;
                
                div.addEventListener('click', () => playStation(station));
                radioList.appendChild(div);
            });
        }
    </script>
</body>
</html>
